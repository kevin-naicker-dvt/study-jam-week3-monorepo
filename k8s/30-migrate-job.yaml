# Run once after ConfigMap + Secret exist and DB is reachable: kubectl apply -f 30-migrate-job.yaml
# Re-runs: kubectl delete job studyjam-migrate -n studyjam && kubectl apply -f 30-migrate-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: studyjam-migrate
  namespace: studyjam
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: africa-south1-docker.pkg.dev/dvt-lab-devfest-2025/studyjam-repo/studyjam-backend:gke-latest
          command: ["node", "dist/database/migrate.js"]
          envFrom:
            - configMapRef:
                name: studyjam-backend-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: studyjam-runtime
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: studyjam-runtime
                  key: JWT_SECRET
