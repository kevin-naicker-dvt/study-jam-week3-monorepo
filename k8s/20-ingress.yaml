# Paths: /health and /api → backend; / → frontend SPA (nginx).
# Set spec.rules[0].host to your DNS name; point it at the Ingress IP when provisioned.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: studyjam-ingress
  namespace: studyjam
  annotations:
    kubernetes.io/ingress.class: "gce"
spec:
  rules:
    - host: studyjam.example.com
      http:
        paths:
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: studyjam-backend
                port:
                  number: 3000
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: studyjam-backend
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: studyjam-frontend
                port:
                  number: 8080
