# GCE Ingress: /health + /api → backend; / → frontend. Edit spec.rules[0].host for your DNS.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: studyjam-k8s-ingress
  labels:
    app.kubernetes.io/name: studyjam-ingress
    app.kubernetes.io/part-of: studyjam-week3
  annotations:
    kubernetes.io/ingress.class: "gce"
spec:
  rules:
    - host: studyjam.example.com
      http:
        paths:
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: studyjam-k8s-be
                port:
                  number: 3000
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: studyjam-k8s-be
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: studyjam-k8s-fe
                port:
                  number: 8080
