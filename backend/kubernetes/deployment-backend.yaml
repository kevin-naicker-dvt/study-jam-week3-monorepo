# Backend API (NestJS). Requires Secret studyjam-k8s-runtime: DB_PASSWORD, JWT_SECRET.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: studyjam-k8s-be
  labels:
    app.kubernetes.io/name: studyjam-backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: studyjam-week3
spec:
  replicas: 2
  selector:
    matchLabels:
      app: studyjam-k8s-be
  template:
    metadata:
      labels:
        app: studyjam-k8s-be
        app.kubernetes.io/name: studyjam-backend
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: studyjam-week3
    spec:
      containers:
        - name: backend
          image: africa-south1-docker.pkg.dev/dvt-lab-devfest-2025/studyjam-repo/studyjam-backend:gke-latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: studyjam-k8s-backend-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: studyjam-k8s-runtime
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: studyjam-k8s-runtime
                  key: JWT_SECRET
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
