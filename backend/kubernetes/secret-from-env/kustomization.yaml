# Creates namespace studyjam-k8s (if needed) and Secret studyjam-k8s-runtime from a local env file.
#
# Prerequisites:
#   cp ../env/runtime-secrets.env.example ../env/runtime-secrets.env
#   # edit ../env/runtime-secrets.env — replace placeholders with real values
#
# Apply (from repo root, kubectl aimed at your cluster):
#   kubectl apply -k backend/kubernetes/secret-from-env
#
# Same keys as deployment-backend.yaml: DB_PASSWORD, JWT_SECRET
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: studyjam-k8s

resources:
  - ../namespace.yaml

generatorOptions:
  disableNameSuffixHash: true

secretGenerator:
  - name: studyjam-k8s-runtime
    envs:
      - ../env/runtime-secrets.env
